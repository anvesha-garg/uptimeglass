[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = basic errors, I = import order, B = likely bugs, UP = modern Python
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests do "from app... import ..." when run from the backend folder.
pythonpath = ["."]
# Async tests and fixtures run without extra decorators.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
