name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: ruff format --check backend

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real Postgres for the tests, thrown away after the run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uptimeglass
          POSTGRES_PASSWORD: uptimeglass
          POSTGRES_DB: uptimeglass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uptimeglass -d uptimeglass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://uptimeglass:uptimeglass@localhost:5432/uptimeglass_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the compose file is valid
        run: docker compose config -q
      - name: Start Postgres and Redis and wait until they are healthy
        run: docker compose up -d --wait --wait-timeout 90
      - name: Show container status
        run: docker compose ps
      - name: Clean up
        if: always()
        run: docker compose down -v
